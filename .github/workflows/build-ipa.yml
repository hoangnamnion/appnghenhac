name: Build iOS IPA & Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apps:
    name: Build & Package .IPA & .APK Files
    runs-on: macos-14

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java (Java 21 for Android Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Automated Tests
        run: |
          npm test || npx vitest run --passWithNoTests || true

      - name: Build Web App
        run: |
          npm run build

      - name: Scaffold & Sync Capacitor Platforms
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync

      - name: Build Android APK
        run: |
          cd android
          tr -d '\r' < gradlew > gradlew_clean && mv gradlew_clean gradlew
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "Build Android APK thanh cong!"

      - name: Build iOS App Bundle
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r -9 DoraemonPocketPlayer.ipa Payload
          echo "Build iOS IPA thanh cong!"

      - name: Upload IPA Artifact (iOS)
        uses: actions/upload-artifact@v4
        with:
          name: Doraemon-iOS-IPA
          path: ios/App/build/DoraemonPocketPlayer.ipa
          retention-days: 14

      - name: Upload APK Artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: Doraemon-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
